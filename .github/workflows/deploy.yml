name: Despliegue Seguro Certificados ULEP (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permisos mínimos de seguridad (Principio de Menor Privilegio)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-secure-deploy"
  cancel-in-progress: true

jobs:
  build-and-verify-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout seguro del código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar entorno Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias verificadas
        run: npm install --no-audit --no-fund

      - name: Verificación estática de tipos e integridad (TypeScript)
        run: npm run lint

      - name: Compilar versión de producción blindada (sin sourcemaps)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Auditoría de seguridad del artefacto compilado
        run: |
          # Garantizar que ningún archivo .map (código fuente expuesto) ni .env se filtre al despliegue público
          rm -f dist/**/*.map dist/*.map dist/.env* || true
          if find dist -name "*.map" | grep -q .; then
            echo "ERROR DE SEGURIDAD: Se detectaron archivos SourceMap en dist/."
            exit 1
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar artefacto cifrado para despliegue
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify-security
    steps:
      - name: Desplegar en GitHub Pages bajo HTTPS obligatorio
        id: deployment
        uses: actions/deploy-pages@v4
